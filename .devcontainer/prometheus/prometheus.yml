# Prometheus configuration for Axon MCP dev-container
# Scrape targets for API and workers (all run inside this container)

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'dev-container'

scrape_configs:
  # API server metrics
  - job_name: 'axon-api'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
